# .github/workflows/supply-chain.yml
# OSV-Scanner (new vulns on PRs, full scan otherwise), Dependency Review with the SPDX allowlist from the justfile,
# zizmor for workflow hygiene, and an SBOM + Grype job with Harden-Runner (egress-policy: audit until the allowlist is known).
name: supply-chain
on:
  pull_request:
  merge_group:
  push: { branches: [main] }
  schedule: [{ cron: "30 5 * * 1" }]
permissions: {}
jobs:
  osv-pr:                                   # SUPPLY: fail on NEW vulns introduced by the PR (free)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions: { actions: read, security-events: write, contents: read }
  osv-full:
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions: { actions: read, security-events: write, contents: read }
  dependency-review:                        # SUPPLY + LICENSE (public repos free; private needs GHAS)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # keep in sync with the `licenses` recipe in the justfile
          allow-licenses: MIT, MIT-0, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, MPL-2.0, CC0-1.0, CC-BY-4.0, Unlicense, BlueOak-1.0.0, OFL-1.1, Python-2.0
          # The one reviewed exception (docs/decisions/0002-stack.md): the Sentry CLI that @sentry/node ships, FSL-1.1-Apache-2.0.
          allow-dependencies-licenses: pkg:npm/sentry
          comment-summary-in-pr: on-failure
  zizmor:                                   # CICD hygiene: unpinned-uses, template-injection, cooldown...
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read, actions: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
  sbom-and-grype:                           # REG evidence + SUPPLY
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3 (free for public repos)
        with: { egress-policy: audit }      # switch to block + allowed-endpoints once the baseline is known
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json "packageManager")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: package.json, cache: pnpm }   # engines.node from package.json
      - run: npm i -g sfw @cdxgen/cdxgen --ignore-scripts --min-release-age=3
      - run: sfw pnpm install --frozen-lockfile          # Socket Firewall blocks known-malicious packages
      - run: npm audit signatures                        # registry signatures + provenance attestations
      - run: cdxgen -o sbom.cdx.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom, path: sbom.cdx.json }
      - id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with: { sbom: sbom.cdx.json, fail-build: true, severity-cutoff: high, output-format: sarif }
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with: { sarif_file: "${{ steps.grype.outputs.sarif }}" }
