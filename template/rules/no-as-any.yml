id: no-as-any
language: TypeScript
severity: error
message: 'Do not cast to `any`; it switches type checking off for the whole expression.'
note: 'Use a precise type, or `unknown` plus narrowing (a Zod schema from src/schemas/ at IO boundaries).'
rule:
  any:
    - pattern: $E as any
    - pattern: <any>$E
---
id: no-as-any-tsx
language: Tsx
severity: error
message: 'Do not cast to `any`; it switches type checking off for the whole expression.'
note: 'Use a precise type, or `unknown` plus narrowing (a Zod schema from src/schemas/ at IO boundaries).'
rule:
  pattern: $E as any
